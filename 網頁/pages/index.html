<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動報名 - 極客魂社團線上表單系統</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../scripts/TailwindCSS.js"></script>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <!-- ========== Header ========== -->
  <header>
    <div class="header-content">
      <h1>《極客魂社團》線上表單系統</h1>
      <p>社團活動報名、名額管理與行政支援系統</p>
    </div>
    <div class="header-actions">
      <a href="login.html" class="btn-login">幹部登入</a>
    </div>
  </header>

  <!-- ========== Main Content ========== -->
  <main>
    <!-- 活動報名 Section -->
      <div class="card">
        <h2>社團活動報名</h2>
        <p style="margin-bottom: 2rem; color: var(--color-text-secondary);">
          選擇下方活動卡片進行報名。完成報名後，系統將自動判定是否額滿，並寄送通知信。
        </p>

        <h3>近期活動</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6" id="availableActivities">
          <!-- 活動卡片將由 JavaScript 動態載入 -->
        </div>
      </div>
  </main>

  <!-- ========== Modal Form ========== -->
  <div id="registrationModal" class="modal">
    <div class="modal-content">
      <!-- 海報區域 -->
      <div class="modal-poster" id="modalPoster">
        <div class="poster-placeholder">
          <span>🖼️ 活動海報</span>
        </div>
      </div>
      <div class="modal-header">
        <h2 id="modalActivityTitle">社團活動報名</h2> 
        <button class="modal-close">&times;</button>
      </div>
      
      <!-- 活動資訊區域（由 JavaScript 動態生成） -->
      <div class="modal-activity-info" id="modalActivityInfo"></div>

      <div class="modal-body">
          <div class="form-group">
            <label>是否為極客魂社員 <span class="required">*</span></label>
            <p class="form-hint">社員將優先錄取，有在 Line 群組者即為社員。</p>
            <div class="radio-group">
              <label class="radio-label">
                <input type="radio" name="isMember" id="memberYes" value="yes" required checked>
                <span>是</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="isMember" id="memberNo" value="no" required>
                <span>否（非社員也可以來參加~）</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label>系級 <span class="required">*</span></label>
            <input type="text" id="department" placeholder="例： 資工一A、人工二B" required>
          </div>

          <div class="form-group">
            <label>姓名 <span class="required">*</span></label>
            <input type="text" id="name" placeholder="例： 王小明" required>
          </div>

          <div class="form-group">
            <label>學號 <span class="required">*</span></label>
            <input type="text" id="studentId" placeholder="例： 411345678" required>
          </div>

          <div class="form-group">
            <label>Line 暱稱 <span id="lineNameRequired" class="required">*</span></label>
            <input type="text" id="lineName" placeholder="請輸入您在 Line 群組的暱稱" required>
            <p class="form-hint" id="lineNameHint">請輸入您在社團 Line 群組中顯示的暱稱</p>
          </div>

          <div class="form-group">
            <label>常用 Email 帳號 <span class="required">*</span></label>
            <input type="email" id="email" placeholder="example@gmail.com" required>
          </div>

          <div class="form-group">
            <label style="display: flex; align-items: center;">
              <input type="checkbox" id="agreement" style="width: auto; margin-right: 0.5rem;" required>
              我同意提供上述資料用於報名統計與通知用途
            </label>
          </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelBtn">取消</button>
        <button class="btn btn-success" id="submitBtn">提交報名</button>
      </div>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="../scripts/jQuery.js"></script>
  <script src="../scripts/utils.js"></script>
  <script src="../scripts/activities.js"></script>
  <script src="../scripts/form-validation.js"></script>
  <script src="../scripts/registration.js"></script>
</body>
</html>
