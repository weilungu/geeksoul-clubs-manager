<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幹部管理 - 極客魂社團線上表單系統</title>
  <script src="../scripts/TailwindCSS.js"></script>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <!-- ========== Header ========== -->
  <header>
    <div class="header-content">
      <h1>《極客魂社團》線上表單系統</h1>
      <p>社團活動報名、名額管理與行政支援系統</p>
    </div>
  </header>

  <!-- ========== Navigation ========== -->
  <nav>
    <a href="overview.html">系統概覽</a>
    <a href="staff-panel.html">幹部管理</a>
    <a href="admin.html">行政查核</a>
  </nav>

  <!-- ========== Main Content ========== -->
  <main>
    <!-- 幹部管理 Section -->
    <div class="card">
      <h2>幹部管理介面</h2>
      <p style="margin-bottom: 1.5rem; color: var(--color-text-secondary); font-weight: 500;">
        ⚙️ 本功能需透過幹部帳號登入。登入後可進行活動建立、編輯與名額管理。
      </p>

      <h3>登入</h3>
      <div style="max-width: 400px;">
        <div class="form-group">
          <label>帳號（社團幹部登入）</label>
          <input type="email" placeholder="example@example.com">
        </div>
        <div class="form-group">
          <label>密碼</label>
          <input type="password" placeholder="••••••••">
        </div>
        <button class="btn btn-primary">登入</button>
      </div>

      <h3 style="margin-top: 3rem;">活動管理面板（登入後顯示）</h3>
      <div class="alert info">
        <strong>提示：</strong>登入成功後，此處將顯示所有已建立的活動與管理選項。
      </div>

      <div style="margin-top: 2rem;">
        <button class="btn btn-primary" style="margin-bottom: 1.5rem;">+ 建立新活動</button>

        <h4 style="color: var(--color-text-main); margin-bottom: 1rem;">已建立的活動</h4>
        <table>
          <thead>
            <tr>
              <th>活動名稱</th>
              <th>報名狀態</th>
              <th>已報名／名額</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>示例活動：新生入門講座</strong></td>
              <td><span class="badge success">開放報名</span></td>
              <td>15 / 50</td>
              <td>
                <button class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.9rem;">編輯</button>
                <button class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.9rem; margin-left: 0.5rem;">查看名單</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3>新增活動表單</h3>
      <div style="max-width: 600px;">
        <div class="form-group">
          <label>活動名稱 *</label>
          <input type="text" placeholder="例：2024年秋季 Workshop">
        </div>

        <div class="form-group">
          <label>活動時間 *</label>
          <input type="datetime-local">
        </div>

        <div class="form-group">
          <label>活動說明</label>
          <textarea rows="4" placeholder="詳細說明活動內容、議程、注意事項等..."></textarea>
        </div>

        <div class="form-group">
          <label>名額上限 *</label>
          <input type="number" placeholder="50" min="1">
        </div>

        <div class="form-group">
          <label>活動海報圖片網址（Google Drive）</label>
          <input type="url" placeholder="https://drive.google.com/...">
        </div>

        <div class="form-group">
          <label>報名狀態</label>
          <select>
            <option>開放報名</option>
            <option>暫停報名</option>
            <option>已截止</option>
          </select>
        </div>

        <button class="btn btn-success">建立活動</button>
        <button class="btn btn-secondary" style="margin-left: 0.5rem;">取消</button>
      </div>
    </div>
  </main>

  <script src="../scripts/main.js"></script>
</body>
</html>
