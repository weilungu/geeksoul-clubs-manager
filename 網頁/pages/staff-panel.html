<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幹部管理 - 極客魂社團線上表單系統</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../scripts/TailwindCSS.js"></script>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <!-- ========== Header ========== -->
  <header>
    <div class="header-content">
      <h1>《極客魂社團》線上表單系統</h1>
      <p>社團活動報名、名額管理與行政支援系統</p>
    </div>
  </header>

  <!-- ========== Navigation ========== -->
  <nav>
    <a href="overview.html">系統概覽</a>
    <a href="staff-panel.html">幹部管理</a>
    <a href="admin.html">行政查核</a>
  </nav>

  <!-- ========== Main Content ========== -->
  <main>
    <!-- 幹部管理 Section -->
    <div class="card">
      <h2>幹部管理介面</h2>
      <p style="margin-bottom: 1.5rem; color: var(--color-text-secondary); font-weight: 500;">
        ⚙️ 本功能需透過幹部帳號登入。登入後可進行活動建立、編輯與名額管理。
      </p>

      <h3>活動管理面板</h3>
      <div class="alert info">
        <strong>提示：</strong>登入成功後，此處將顯示所有已建立的活動與管理選項。
      </div>

      <div style="margin-top: 2rem;">
        <button class="btn btn-primary" style="margin-bottom: 1.5rem;" onclick="openCreateEventModal()">+ 建立新活動</button>

        <h4 style="color: var(--color-text-main); margin-bottom: 1rem;">已建立的活動</h4>
        <table>
          <thead>
            <tr>
              <th>活動名稱</th>
              <th>報名狀態</th>
              <th>已報名／名額</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>示例活動：新生入門講座</strong></td>
              <td><span class="badge success">開放報名</span></td>
              <td>15 / 50</td>
              <td>
                <button class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.9rem;">編輯</button>
                <button class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.9rem; margin-left: 0.5rem;">查看名單</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- ========== 新增活動 Modal ========== -->
  <div id="createEventModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>新增活動表單</h2>
        <button type="button" class="modal-close">&times;</button>
      </div>
      <form id="createEventForm" novalidate>
        <div class="modal-body">
          <div class="form-group">
            <label>活動名稱 <span class="required">*</span></label>
            <input type="text" id="eventName" placeholder="例：極客魂新生入門講座" required>
          </div>

          <div class="form-group">
            <label>活動日期時間 <span class="required">*</span></label>
            <input type="text" id="eventDate" placeholder="例：2025年1月15日 19:00 - 21:00" required>
          </div>

          <div class="form-group">
            <label>活動地點 <span class="required">*</span></label>
            <input type="text" id="eventLocation" placeholder="例：資訊大樓 101 教室" required>
          </div>

          <div class="form-group">
            <label>講師 <span class="required">*</span></label>
            <input type="text" id="eventSpeaker" placeholder="例：技術長 David" required>
          </div>

          <div class="form-group">
            <label>活動說明</label>
            <textarea rows="4" id="eventDescription" placeholder="詳細說明活動內容、議程、注意事項等..."></textarea>
          </div>

          <div class="form-group">
            <label>名額上限 <span class="required">*</span></label>
            <input type="number" id="eventQuota" placeholder="50" min="1" required>
          </div>

          <div class="form-group">
            <label>活動海報圖片網址（Google Drive）</label>
            <input type="url" id="eventPoster" placeholder="https://drive.google.com/thumbnail?id=...&sz=w1000">
          </div>

          <div class="form-group">
            <label>報名狀態</label>
            <select id="eventStatus">
              <option>開放報名</option>
              <option>暫停報名</option>
              <option>已截止</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelCreateEventBtn">取消</button>
          <button type="submit" class="btn btn-success" id="submitCreateEventBtn">建立活動</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="../scripts/jQuery.js"></script>
  <script src="../scripts/utils.js"></script>
  <script src="../scripts/staff-panel.js"></script>
</body>
</html>
