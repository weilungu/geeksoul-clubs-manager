<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幹部管理 - 極客魂社團線上表單系統</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../scripts/TailwindCSS.js"></script>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    .success-notification {
      background: linear-gradient(135deg, #2E7D32, #43A047);
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      margin-top: 1.5rem;
      font-weight: 500;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .success-notification::before {
      content: '✓';
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- ========== Header ========== -->
  <header>
    <div class="header-content">
      <h1>《極客魂社團》線上表單系統</h1>
      <p>社團活動報名、名額管理與行政支援系統</p>
    </div>
  </header>

  <!-- ========== Navigation ========== -->
  <nav>
    <a href="overview.html">系統概覽</a>
    <a href="staff-panel.html">幹部管理</a>
    <a href="admin.html">行政查核</a>
  </nav>

  <!-- ========== Main Content ========== -->
  <main>
    <!-- 幹部管理 Section -->
    <div class="card">
      <h2>幹部管理介面</h2>
      <p style="margin-bottom: 1.5rem; color: var(--color-text-secondary); font-weight: 500;">
        ⚙️ 本功能需透過幹部帳號登入。登入後可進行活動建立、編輯與名額管理。
      </p>

      <h3>活動管理面板</h3>
      <div class="alert info">
        <strong>提示：</strong>登入成功後，此處將顯示所有已建立的活動與管理選項。
      </div>

      <div style="margin-top: 2rem;">
        <button class="btn btn-primary" style="margin-bottom: 1.5rem;" onclick="openCreateEventModal()">+ 建立新活動</button>

        <h4 style="color: var(--color-text-main); margin-bottom: 1rem;">已建立的活動</h4>
        <table>
          <thead>
            <tr>
              <th>活動名稱</th>
              <th>報名狀態</th>
              <th>已報名／名額</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <!-- 活動將由 JavaScript 動態載入 -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- 成功訊息通知 -->
    <div id="successNotification" class="success-notification" style="display: none;">
      <span id="successMessage"></span>
    </div>
  </main>

  <!-- ========== 新增活動 Modal ========== -->
  <div id="createEventModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>新增活動表單</h2>
        <button type="button" class="modal-close">&times;</button>
      </div>
      <form id="createEventForm" novalidate>
        <div class="modal-body">
          <div class="form-group">
            <label>活動名稱 <span class="required">*</span></label>
            <input type="text" id="eventName" placeholder="例：極客魂新生入門講座" required>
          </div>

          <div class="form-group" style="background-color: #f5f5f5; padding: 1rem; border-radius: 8px; border-left: 4px solid var(--color-primary);">
            <label style="display: flex; align-items: center; cursor: pointer; font-weight: 600; color: var(--color-text-main);">
              <input type="checkbox" id="noDeadline" style="width: 18px; height: 18px; margin-right: 0.75rem; cursor: pointer; accent-color: var(--color-primary);">
              無截止時間（活動持續開放報名）
            </label>
            <p class="form-hint" style="margin: 0.5rem 0 0 2rem; font-size: 0.85rem;">勾選此選項後，活動將不受時間限制，永久顯示在首頁</p>
          </div>

          <div class="form-group">
            <label>活動開始時間 <span class="required">*</span></label>
            <input type="datetime-local" id="eventStartTime" required>
          </div>

          <div class="form-group">
            <label>活動結束時間 <span class="required">*</span></label>
            <input type="datetime-local" id="eventEndTime" required>
          </div>

          <div class="form-group">
            <label>報名截止時間 <span class="required">*</span></label>
            <input type="datetime-local" id="eventDeadline" required>
            <p class="form-hint">過了截止時間，活動卡片將自動從首頁移除</p>
          </div>

          <div class="form-group">
            <label>活動地點 <span class="required">*</span></label>
            <input type="text" id="eventLocation" placeholder="例：資訊大樓 101 教室" required>
          </div>

          <div class="form-group">
            <label>講師 <span class="required">*</span></label>
            <input type="text" id="eventSpeaker" placeholder="例：技術長 David" required>
          </div>

          <div class="form-group">
            <label>活動說明</label>
            <textarea rows="4" id="eventDescription" placeholder="詳細說明活動內容、議程、注意事項等..."></textarea>
          </div>

          <div class="form-group">
            <label>名額上限 <span class="required">*</span></label>
            <input type="number" id="eventQuota" placeholder="50" min="1" required>
          </div>
          
          <div class="form-group" style="background-color: #f5f5f5; padding: 1rem; border-radius: 8px; border-left: 4px solid var(--color-secondary);">
            <label style="display: flex; align-items: center; cursor: pointer; font-weight: 600; color: var(--color-text-main);">
              <input type="checkbox" id="noQuotaLimit" style="width: 18px; height: 18px; margin-right: 0.75rem; cursor: pointer; accent-color: var(--color-secondary);">
              無名額上限（不限制報名人數）
            </label>
            <p class="form-hint" style="margin: 0.5rem 0 0 2rem; font-size: 0.85rem;">勾選此選項後，活動將不限制報名人數</p>
          </div>

          <div class="form-group">
            <label>活動海報（Google Drive ID）</label>
            <input type="text" id="eventPoster" placeholder="例：1Q3WMjdgau9bg9WJv7KutwhRtOXvZ6C-t">
            <p class="form-hint">請輸入 Google Drive 檔案 ID，系統將自動轉換為縮圖連結</p>
          </div>

          <div class="form-group">
            <label>報名狀態</label>
            <select id="eventStatus">
              <option>開放報名</option>
              <option>暫停報名</option>
              <option>已截止</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelCreateEventBtn">取消</button>
          <button type="submit" class="btn btn-success" id="submitCreateEventBtn">建立活動</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="../scripts/api.js"></script>
  <script src="../scripts/jQuery.js"></script>
  <script src="../scripts/utils.js"></script>
  <script src="../scripts/staff-panel.js"></script>

  <!-- ========== 報名名單 Modal ========== -->
  <div id="registrationsModal" class="modal">
    <div class="modal-content" style="max-width: 900px;">
      <div class="modal-header">
        <h2 id="registrationsModalTitle">報名名單</h2>
        <button type="button" class="modal-close" onclick="closeRegistrationsModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="registrationsTableContainer">
          <!-- 報名名單將由 JavaScript 動態載入 -->
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeRegistrationsModal()">關閉</button>
      </div>
    </div>
  </div>
</body>
</html>
